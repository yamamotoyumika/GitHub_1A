linuxのコマンド
<p>touch linux.htmlで新規ファイル追加</p>
<p>git add ファイル名で保存</p>
<p>git commit -m 'メッセージ'</p>
<p>git push -u origin mainでgithubに追加</p>
<p>addの取り消し(ファイルの追加)
    <p>git rm --cached ファイル名</p>
</p>
<p>addの取り消し(ファイルの変更)
    <p>git restore --staged ファイル名</p>
</p>
<p>ローカル作業の取り消し(最後にコミットした状態に変更)
    <p>git stash</p>
</p>
